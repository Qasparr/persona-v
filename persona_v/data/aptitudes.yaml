# APTITUDE PROFILES — DRAFT, AWAITING THE AUTHOR'S RED PEN
#
# What this is: the "aptitude test" behind Assignment. Every flavor is
# rated 0-2 on each of 16 dimensions:
#
#   Functions (the eightfold lens): Te Ti Fe Fi Ne Ni Se Si
#   Layers (the Jungian core):       persona ego shadow anima self
#   Operational (how the work goes): precision swiftness gravity
#
#   0 = no aptitude (omit the key entirely -- sparse is honest)
#   1 = capable
#   2 = native, excellent
#
# How it is used: a task is probed for *demands* on the same dimensions
# (see PROBES in persona_v/assignment.py), each flavor is scored as
# sum(demand[d] * aptitude[d]), and the highest fit presides. The full
# scorecard lands in the assignment rationale, so every election is
# auditable.
#
# STATUS: DRAFT. These ratings were drafted by the builder from the
# grimoire's own character texts (name, epithet, character) -- the
# author's words, interpreted. They are NOT the author's doctrine.
# The author corrects this file; the engine reads whatever is here.
# Every profile carries a `note` citing the character line it was
# drawn from, so corrections can be argued line by line.

dimensions:
  functions: [Te, Ti, Fe, Fi, Ne, Ni, Se, Si]
  layers: [persona, ego, shadow, anima, self]
  operational: [precision, swiftness, gravity]

